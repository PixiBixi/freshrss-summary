<!DOCTYPE html>
<html lang="fr" data-theme="light" data-density="scan">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>FreshRSS Summary</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <script>
    // Theme, density and accent applied before first paint (no flash). Same keys as the login page.
    (function () {
      var r = document.documentElement;
      function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
      try {
        var old = localStorage.getItem('freshrss-accent');
        if (old !== null) {
          if (old !== '#5c98a0' && !localStorage.getItem('accent')) localStorage.setItem('accent', old);
          localStorage.removeItem('freshrss-accent');
        }
      } catch (e) {}
      r.dataset.theme = get('theme') === 'dark' ? 'dark' : 'light';
      r.dataset.density = get('freshrss-density') === 'read' ? 'read' : 'scan';
      var a = get('accent');
      if (a && /^#[0-9a-fA-F]{6}$/.test(a)) {
        var n = parseInt(a.slice(1), 16), lum = (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255;
        r.style.setProperty('--accent', a);
        r.style.setProperty('--on-accent', lum > 0.6 ? '#111' : '#fff');
      }
    })();
  </script>
  <link rel="preload" href="/static/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/static/css/fonts.css" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <a class="skip" href="#list" data-i18n="a11y.skip">Aller aux articles</a>
  <div class="sync-line" id="sync-line" aria-hidden="true"></div>

  <div class="shell" id="shell">
    <aside class="side" id="side" aria-label="Navigation" data-i18n-aria="nav.label">
      <div class="brand"><span class="logo" aria-hidden="true">fr</span>FreshRSS Summary</div>
      <nav class="nav" id="nav" aria-label="Vues" data-i18n-aria="nav.views"></nav>
      <div class="topics">
        <h4><span data-i18n="side.topics">Topics</span><button type="button" data-cmd="cfg" data-auth data-i18n="side.manage">Gérer</button></h4>
        <div id="topic-list"></div>
      </div>
      <div class="filters">
        <label>
          <span class="rowl"><span data-i18n="side.minBurn">Burn rate minimum</span><span class="mono" id="min-val"></span></span>
          <input type="range" id="min-score" min="0" max="800" step="5" value="0" data-i18n-aria="side.minBurn" />
        </label>
        <div class="grp">
          <span data-i18n="side.period">Période</span>
          <div class="seg" role="group" id="days-seg" data-i18n-aria="side.period">
            <button type="button" data-days="7" data-i18n="period.7">7j</button>
            <button type="button" data-days="14" data-i18n="period.14">14j</button>
            <button type="button" data-days="30" data-i18n="period.30">30j</button>
            <button type="button" data-days="0" data-i18n="period.all">Tout</button>
          </div>
        </div>
      </div>
      <div class="user" id="user-block"></div>
    </aside>
    <div class="scrim" id="scrim" data-side></div>

    <main class="main" id="main">
      <div class="bar">
        <button type="button" class="btn ico menu-btn" data-side data-i18n-aria="bar.openNav"><span data-ic="side"></span></button>
        <button type="button" class="btn ico desk" id="collapse-btn" data-cmd="collapse" data-i18n-aria="bar.sidebar" data-i18n-title="bar.sidebar"><span data-ic="side"></span></button>
        <h1><span id="view-title">Triage</span><span id="view-count"></span></h1>
        <label class="search">
          <span data-ic="search"></span>
          <span class="sr" data-i18n="search.label">Filtrer les articles</span>
          <input id="q" type="search" data-i18n="search.placeholder" autocomplete="off" />
          <button type="button" class="x" id="q-clear" data-cmd="clearq" data-i18n-aria="search.clear" hidden><span data-ic="x"></span></button>
          <kbd id="q-kbd">/</kbd>
        </label>
        <button type="button" class="btn" id="ack-visible" data-cmd="ackvisible" hidden></button>
        <div class="seg desk" role="group" data-i18n-aria="dens.label">
          <button type="button" data-dens="scan" data-i18n="dens.scan">Scan</button>
          <button type="button" data-dens="read" data-i18n="dens.read">Lecture</button>
        </div>
        <button type="button" class="btn desk" id="pin-btn" data-cmd="pin" data-i18n-title="bar.previewTitle"><span data-ic="pane"></span><span class="lbl-t" data-i18n="bar.preview">Aperçu</span></button>
        <button type="button" class="btn ico desk" data-cmd="palette" data-i18n-aria="bar.palette" data-i18n-title="bar.palette"><span data-ic="cmd"></span></button>
        <button type="button" class="btn primary" id="sync-btn" data-cmd="sync" data-auth></button>
        <a class="btn primary" href="/login" data-anon data-i18n="btn.login">Connexion</a>
        <button type="button" class="btn ico" id="menu-btn" data-cmd="menu" aria-haspopup="menu" aria-expanded="false" data-i18n-aria="bar.more"><span data-ic="more"></span></button>
        <div class="pop" id="menu-pop" role="menu" hidden></div>
      </div>
      <div class="err-banner" id="err-banner" role="alert" hidden></div>
      <div class="sum" id="sum" role="group" data-i18n-aria="sum.label"></div>
      <section class="list" id="list" tabindex="-1" role="listbox" data-i18n-aria="list.label"></section>
    </main>

    <aside class="panel" id="panel" data-i18n-aria="reader.label"></aside>
  </div>

  <div id="layer"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script>window._AUTH = {{ authenticated | tojson }}; window._USER = {{ username | tojson }};</script>
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/state.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/render.js"></script>
  <script src="/static/js/ui.js"></script>
</body>
</html>
