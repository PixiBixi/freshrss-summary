[project]
name = "freshrss-summary"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "itsdangerous==2.2.0",
    "python-multipart==0.0.32",
    "pydantic==2.13.4",
    "uvicorn[standard]==0.52.1",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "jinja2==3.1.6",
    # [asyncio] pulls greenlet, which SQLAlchemy's async engine needs. Without the
    # extra it is only installed on platforms matching SQLAlchemy's own markers —
    # macOS arm64 reports "arm64" and is not one of them.
    "sqlalchemy[asyncio]==2.0.51",
    "aiosqlite==0.22.1",
    "prometheus-client==0.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
# Deprecations fail the build instead of surfacing in production logs months later.
# A static linter cannot catch these: they are raised at runtime, often from inside a
# dependency. When one is genuinely outside our control, add a targeted entry such as
# "ignore::DeprecationWarning:some_module" rather than dropping the error rule.
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# B: bugbear, ASYNC: blocking calls in async, RUF: incl. dangling tasks (RUF006),
# SLF: private member access on third-party libs
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF", "SLF"]
# RUF003: typographic characters (×, ') are deliberate in the French comments
ignore = ["E501", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately reach into internals and use mutable fixtures.
"tests/*" = ["SLF001", "RUF012"]
